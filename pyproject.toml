[project]
name = "energy-ai"
version = "0.1.0"
description = "AI models for energy systems, from power flow to reinforcement learning: forecasting, optimisation, grid analytics, cybersecurity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=16",
    "torch>=2.5",
    "pandapower>=3.0",
    "simbench>=1.5",
    "lightsim2grid>=0.9",
    "networkx>=3.2",
    "pyomo>=6.7",
    "highspy>=1.7",
    "gymnasium>=1.0",
    "holidays>=0.50",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["jupytext>=1.16", "nbclient>=0.10", "jupyterlab>=4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
